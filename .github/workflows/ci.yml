# Build and test everything on every push to main and every pull request.
# Offline and keyless: no secrets, no testnet, no deploys. The web app builds and runs on mocks with an empty env, and
# the end-to-end tests run in e2e.yml (Boat runner). Every action is pinned to a full commit SHA (tag in the comment).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_VERSION: v1.10.0
  NODE_VERSION: "22"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  contracts:
    name: Contracts (forge build + test)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: ${{ env.FOUNDRY_VERSION }}
          cache: true
      - name: forge build
        working-directory: contracts
        run: forge build --sizes
      - name: forge test
        working-directory: contracts
        run: forge test

  web:
    name: Web (lint, unit tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 (pnpm version from package.json "packageManager")
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm -C web install --frozen-lockfile
      - run: pnpm -C web lint
      - run: pnpm -C web test
      - run: pnpm -C web build

  agent:
    name: Agent (tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            agent/pnpm-lock.yaml
            web/pnpm-lock.yaml
      # The agent imports web/lib/server/* (evidence store, Living Brain, settlement), whose packages resolve from
      # web/node_modules: install both.
      - run: pnpm -C agent install --frozen-lockfile
      - run: pnpm -C web install --frozen-lockfile
      # test/actions.test.ts spawns a local anvil.
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: ${{ env.FOUNDRY_VERSION }}
          cache: true
      - run: pnpm -C agent typecheck
      - run: pnpm agent:test
