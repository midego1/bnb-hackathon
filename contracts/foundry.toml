[profile.default]
src = "src"
out = "out"
# No incremental build cache: the project is small, and the cache file churns on every build.
cache = false
libs = ["lib"]
# Scripts write deployment JSON and hash the demo evidence files served by the web app.
fs_permissions = [
  { access = "read-write", path = "./deployments" },
  { access = "read", path = "../web/public/demo" },
]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 256

[fmt]
line_length = 110

[rpc_endpoints]
anvil = "http://127.0.0.1:8545"
bsc_testnet = "${BSC_TESTNET_RPC_URL}"

[lint]
# Rent periods and response windows are measured in days; validator timestamp drift (seconds) is irrelevant.
exclude_lints = ["block-timestamp"]
