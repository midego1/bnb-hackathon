[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 256

[fmt]
line_length = 110

[rpc_endpoints]
anvil = "http://127.0.0.1:8545"
bsc_testnet = "${BSC_TESTNET_RPC_URL}"
